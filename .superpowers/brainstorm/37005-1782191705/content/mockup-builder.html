<h2>页面原型图 — 智能体配置/开发 (P1)</h2>
<p class="subtitle">/agents/:id — 左配置右测试 双栏布局</p>

<div class="mockup">
  <div class="mockup-header">智能体配置页 — 左右分栏</div>
  <div class="mockup-body" style="padding:0;font-family:'Microsoft YaHei UI',sans-serif">
    <div style="display:grid;grid-template-columns:1fr 390px;height:520px">
      <!-- Left: Config Panel -->
      <div style="padding:22px;overflow:auto;border-right:1px solid #e4e9f0">
        <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:20px">
          <div>
            <h1 style="font:700 27px Bahnschrift;margin:0">客户服务助手</h1>
            <p style="font-size:13px;color:#697386;margin:6px 0 0">配置智能体的身份、模型与行为。</p>
          </div>
          <button class="mock-button" style="background:#3157e8;color:#fff;border:none;padding:11px 17px;border-radius:8px;font-weight:700">保存配置</button>
        </div>

        <div style="margin-bottom:17px">
          <label style="display:block;font-size:12px;font-weight:700;margin-bottom:7px">智能体名称</label>
          <input class="mock-input" value="客户服务助手" style="width:100%">
        </div>
        <div style="margin-bottom:17px">
          <label style="display:block;font-size:12px;font-weight:700;margin-bottom:7px">功能描述</label>
          <input class="mock-input" value="基于产品资料回答客户问题，并给出引用来源。" style="width:100%">
        </div>
        <div style="margin-bottom:17px">
          <label style="display:block;font-size:12px;font-weight:700;margin-bottom:7px">模型</label>
          <select class="mock-input" style="width:100%">
            <option>gpt-4.1-mini</option>
            <option>qwen-plus</option>
            <option>deepseek-chat</option>
          </select>
        </div>
        <div style="margin-bottom:17px">
          <label style="display:block;font-size:12px;font-weight:700;margin-bottom:7px">系统提示词</label>
          <textarea class="mock-input" style="width:100%;min-height:110px;resize:vertical">你是一名严谨、友好的企业客服。优先依据知识库回答；如果资料中没有答案，请明确说明。</textarea>
        </div>
        <div style="background:white;border:1px solid #e4e9f0;border-radius:12px;padding:20px;margin-top:20px">
          <b style="font-size:13px">已连接资源</b>
          <p style="font-size:12px;color:#697386;margin:8px 0 0">▤ 2 个知识文件 &nbsp;&nbsp; ⌘ 1 个工具</p>
        </div>
      </div>

      <!-- Right: Test Chat Panel -->
      <div style="display:flex;flex-direction:column">
        <div style="padding:15px 17px;border-bottom:1px solid #e4e9f0;font-size:13px;font-weight:700">
          测试运行
          <span style="float:right;font-size:10px;padding:4px 7px;border-radius:20px;background:#e7f8f1;color:#16a36a;font-weight:400">本地 Demo</span>
        </div>
        <div style="flex:1;padding:17px;overflow:auto">
          <div style="margin:10px 0;display:flex">
            <div style="background:#f0f2f6;padding:11px 12px;border-radius:10px 10px 10px 3px;font-size:12px;max-width:88%;line-height:1.65">
              你好，我是客户服务助手。你可以问我企业版功能或服务时间。
            </div>
          </div>
          <div style="margin:10px 0;display:flex;justify-content:flex-end">
            <div style="background:#3157e8;color:#fff;padding:11px 12px;border-radius:10px 10px 3px;font-size:12px;max-width:88%">
              企业版支持哪些功能？
            </div>
          </div>
          <div style="margin:10px 0;display:flex">
            <div style="background:#f0f2f6;padding:11px 12px;border-radius:10px 10px 10px 3px;font-size:12px;max-width:88%;line-height:1.65">
              企业版支持私有知识库、模型统一接入、工具调用、权限管理与运行审计。
              <div style="font-size:10px;color:#3157e8;margin-top:7px">引用：产品服务说明 · 演示模式</div>
            </div>
          </div>
        </div>
        <form style="padding:13px;border-top:1px solid #e4e9f0;display:flex;gap:8px">
          <input class="mock-input" placeholder="输入问题，按 Enter 发送" style="flex:1">
          <button class="mock-button" style="background:#3157e8;color:#fff;border:none;padding:10px 14px;border-radius:8px;font-weight:700">发送</button>
        </form>
      </div>
    </div>
  </div>
</div>
