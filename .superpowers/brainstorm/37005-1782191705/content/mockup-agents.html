<h2>页面原型图 — 我的智能体 (P1)</h2>
<p class="subtitle">/agents — 卡片列表 + 创建弹窗</p>

<div class="mockup">
  <div class="mockup-header">智能体列表页</div>
  <div class="mockup-body" style="padding:20px;background:#f4f6f9;font-family:'Microsoft YaHei UI',sans-serif">
    <!-- Page Header -->
    <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:20px">
      <div>
        <h1 style="font:700 27px Bahnschrift;margin:0">我的智能体</h1>
        <p style="font-size:13px;color:#697386;margin:6px 0 0">管理、调试和发布工作空间中的智能体。</p>
      </div>
      <button class="mock-button" style="background:#3157e8;color:#fff;border:none;padding:11px 17px;border-radius:8px;font-weight:700;cursor:pointer">＋ 创建智能体</button>
    </div>

    <!-- Agent Cards Grid -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
      <!-- Card 1 -->
      <div style="background:white;border:1px solid #e4e9f0;border-radius:12px;padding:20px;cursor:pointer">
        <div style="width:38px;height:38px;border-radius:9px;background:#e9efff;color:#3157e8;display:grid;place-items:center;font-weight:800;margin-bottom:14px">客</div>
        <h3 style="font-size:15px;margin:0 0 8px">客户服务助手</h3>
        <p style="font-size:12px;color:#697386;line-height:1.7;min-height:40px;margin:0">基于产品资料回答客户问题，并给出引用来源。</p>
        <div style="display:flex;justify-content:space-between;border-top:1px solid #e4e9f0;padding-top:13px;margin-top:12px;font-size:10px">
          <span style="color:#697386">gpt-4.1-mini</span>
          <span style="color:#16a36a">● 已发布</span>
        </div>
      </div>

      <!-- Card 2 -->
      <div style="background:white;border:1px solid #e4e9f0;border-radius:12px;padding:20px;cursor:pointer">
        <div style="width:38px;height:38px;border-radius:9px;background:#fef3e4;color:#e98124;display:grid;place-items:center;font-weight:800;margin-bottom:14px">数</div>
        <h3 style="font-size:15px;margin:0 0 8px">数据分析师</h3>
        <p style="font-size:12px;color:#697386;line-height:1.7;min-height:40px;margin:0">自动分析业务数据，生成可视化报表和趋势洞察。</p>
        <div style="display:flex;justify-content:space-between;border-top:1px solid #e4e9f0;padding-top:13px;margin-top:12px;font-size:10px">
          <span style="color:#697386">deepseek-chat</span>
          <span style="color:#e98124">○ 草稿</span>
        </div>
      </div>

      <!-- Card 3 - Empty/Create -->
      <div style="background:#fafbfc;border:2px dashed #dce1e8;border-radius:12px;padding:20px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;color:#8b94a4">
        <span style="font-size:28px;margin-bottom:8px">＋</span>
        <span style="font-size:13px">新建智能体</span>
      </div>
    </div>
  </div>
</div>

<div style="height:20px"></div>

<div class="mockup">
  <div class="mockup-header">创建智能体弹窗</div>
  <div class="mockup-body" style="padding:24px;background:white;max-width:520px;margin:0 auto;border-radius:14px;font-family:'Microsoft YaHei UI',sans-serif">
    <h2 style="font:700 22px Bahnschrift;margin:0 0 20px">创建智能体</h2>
    <div style="margin-bottom:17px">
      <label style="display:block;font-size:12px;font-weight:700;margin-bottom:7px">名称</label>
      <input class="mock-input" placeholder="例如：销售支持助手" style="width:100%">
    </div>
    <div style="margin-bottom:20px">
      <label style="display:block;font-size:12px;font-weight:700;margin-bottom:7px">描述</label>
      <textarea class="mock-input" placeholder="它将帮助团队完成什么？" style="width:100%;min-height:80px;resize:vertical"></textarea>
    </div>
    <button class="mock-button" style="width:100%;background:#3157e8;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:700">创建并配置</button>
  </div>
</div>
