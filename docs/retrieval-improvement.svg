<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title description">
  <title id="title">Atlas retrieval quality safeguards</title>
  <desc id="description">HEFT ranking improved from ninth to first, noisy partial matches are removed, and the retrieval regression suite passes.</desc>
  <style>
    .title { font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2328; }
    .label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #57606a; }
    .value { font: 600 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2328; }
    .note { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #57606a; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .track { stroke: #d0d7de; stroke-width: 8; stroke-linecap: round; }
    .before { stroke: #bf8700; fill: #bf8700; }
    .after { stroke: #1a7f37; fill: #1a7f37; }
    .arrow { stroke: #1a7f37; stroke-width: 3; fill: none; }
    @media (prefers-color-scheme: dark) {
      .title, .value { fill: #f0f6fc; }
      .label, .note { fill: #8c959f; }
      .panel { fill: #161b22; stroke: #30363d; }
      .track { stroke: #30363d; }
      .before { stroke: #d29922; fill: #d29922; }
      .after { stroke: #3fb950; fill: #3fb950; }
      .arrow { stroke: #3fb950; }
    }
  </style>

  <text class="title" x="32" y="38">Retrieval quality safeguards</text>

  <rect class="panel" x="32" y="62" width="282" height="202" rx="12"/>
  <text class="label" x="56" y="94">RARE-TERM RANKING</text>
  <text class="value" x="56" y="137">#9 → #1</text>
  <line class="track" x1="63" y1="222" x2="283" y2="222"/>
  <circle class="before" cx="63" cy="222" r="7"/>
  <path class="arrow" d="M 70 216 C 130 160, 210 160, 268 106"/>
  <path class="after" d="M 267 100 L 282 101 L 277 115 Z"/>
  <text class="note" x="56" y="247">HEFT result gains eight positions</text>

  <rect class="panel" x="339" y="62" width="282" height="202" rx="12"/>
  <text class="label" x="363" y="94">LEXICAL FALSE POSITIVE</text>
  <text class="value" x="363" y="137">0.60 → 0</text>
  <line class="track" x1="370" y1="184" x2="590" y2="184"/>
  <line class="before" x1="370" y1="184" x2="502" y2="184" stroke-width="8" stroke-linecap="round"/>
  <circle class="after" cx="370" cy="184" r="7"/>
  <text class="note" x="363" y="218">BM25 reduces partial-match noise</text>
  <text class="note" x="363" y="247">Rare terms outrank generic overlap</text>

  <rect class="panel" x="646" y="62" width="282" height="202" rx="12"/>
  <text class="label" x="670" y="94">CONTINUOUS VERIFICATION</text>
  <text class="value" x="670" y="137">12 / 12</text>
  <circle class="after" cx="677" cy="177" r="5"/>
  <text class="note" x="692" y="181">Python 3.10 and 3.12</text>
  <circle class="after" cx="677" cy="207" r="5"/>
  <text class="note" x="692" y="211">Production web build</text>
  <circle class="after" cx="677" cy="237" r="5"/>
  <text class="note" x="692" y="241">Automatic pull-request checks</text>
</svg>
