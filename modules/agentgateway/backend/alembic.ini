# Alembic configuration. URL and target_metadata are injected by alembic/env.py
# from app.core.database / app.models.db so that database.py stays the single
# source of truth. Do NOT add `sqlalchemy.url` here.

[alembic]
script_location = alembic
prepend_sys_path = .
version_locations = %(here)s/alembic/versions
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
revision_environment = false

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
