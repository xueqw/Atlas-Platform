version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - atlas_postgres:/var/lib/postgresql/data
    secrets:
      - postgres_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - atlas_redis:/data
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    entrypoint: ["sh", "-c"]
    command: ["export MINIO_ROOT_PASSWORD=$$(cat /run/secrets/minio_root_password); exec minio server /data --console-address ':9001'"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlas}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - atlas_minio:/data
    secrets:
      - minio_root_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  atlas_postgres:
  atlas_redis:
  atlas_minio:
secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}
  minio_root_password:
    file: ${MINIO_ROOT_PASSWORD_FILE:-./secrets/minio_root_password}
  redis_password:
    file: ${REDIS_PASSWORD_FILE:-./secrets/redis_password}
