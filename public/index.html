<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas 智能体平台</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/workbench.css"></head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">A</span><span>ATLAS <small>智能体平台</small></span></div>
      <nav id="nav">
        <p>使用智能体</p><button class="nav-item active" data-view="workbench"><span>⌁</span>智能工作台<i>NEW</i></button><button class="nav-item" data-view="apps"><span>▣</span>我的智能体</button>
        <p>构建智能体</p><button class="nav-item" data-view="builder"><span>◇</span>智能体开发</button><button class="nav-item" data-view="templates"><span>▦</span>应用模板</button>
        <p>资源中心</p><button class="nav-item" data-view="knowledge"><span>▤</span>知识库</button><button class="nav-item" data-view="models"><span>◉</span>模型</button><button class="nav-item" data-view="tools"><span>⌘</span>连接器与工具</button>
        <p>平台管理</p><button class="nav-item" data-view="analytics"><span>⌁</span>数据报表</button><button class="nav-item" data-view="settings"><span>⚙</span>权限与设置</button>
      </nav>
      <div class="server-state"><b><span></span> 本地服务运行中</b><small>localhost:3000</small></div>
    </aside>
    <main>
      <header><button id="menuBtn" class="icon-btn menu">☰</button><div class="crumb"><span>默认工作空间</span><b id="pageTitle">智能工作台</b></div><div class="header-actions"><button class="search">⌕ 搜索功能或智能体 <kbd>⌘ K</kbd></button><button class="icon-btn">♢</button><div class="avatar">X</div></div></header>
      <section id="view" class="view"></section>
    </main>
  </div>
  <div id="modal" class="modal" aria-hidden="true"><div class="modal-card"><button class="modal-close" aria-label="关闭">×</button><div id="modalBody"></div></div></div>
  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
